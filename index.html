<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Info Warga & Lapangan</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2 style="text-align: center; margin-bottom: 5px; color: #1e293b;">📖 Latihan Lansia Coding</h2>
    <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Sistem PWA Cloud-Synchronized dengan GPS & Firebase</p>
    
    <!-- Tombol Install A2HS -->
    <button id="installBtn" class="install-btn" style="display: none;">📲 Install Dashboard ke Perangkat</button>

    <!-- Form Input Laporan -->
    <div class="form-group">
      <input type="text" id="nameInput" placeholder="Nama Pengirim..." required>
    </div>

    <div class="form-group">
      <input type="email" id="emailInput" placeholder="Alamat Email..." required>
    </div>

    <div class="form-group">
      <textarea id="noteInput" placeholder="Catatan atau laporan tugas lapangan..." rows="5" required></textarea>
    </div>

    <div class="form-group">
      <input type="text" id="locationNameInput" placeholder="Keterangan Lokasi (Cth: Jl. Joyo Tambaksari No. 10)" autocomplete="off">
      <!-- Elemen penampung list hasil pencarian otomatis -->
      <div id="suggestionsList" class="autocomplete-suggestions"></div>
    </div>
   
    <!-- Tombol & Status GPS -->
    <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
      <button id="geoBtn" type="button" style="background-color: #0d9488; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500;">Ambil Posisi GPS</button>
      <span id="geoStatus" style="font-size: 0.85rem; color: #64748b;">Belum ada lokasi dipilih</span>
    </div>

    <!-- Peta Interaktif Leaflet -->
    <div id="map" class="map-container" style="height: 280px; border-radius: 8px; margin-bottom: 20px;"></div>

    <button id="saveBtn" type="button" style="margin-bottom: 20px; background-color: #1e3a8a; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem;">Publikasikan Informasi</button>
x
    <!-- Area daftar data -->
    <div class="notes-list" id="notesList"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Script Utama dengan Dukungan Modul Firebase -->
  <script type="module" src="app.js"></script>
</body>
</html>
