<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Pintar PWA - Hari 1</title>
  
  <!-- Menghubungkan file manifest PWA -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Meta tag warna tema untuk bar status browser seluler -->
  <meta name="theme-color" content="#2563eb">
  
  <!-- Menghubungkan stylesheet eksternal -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>📝 Catatan Pintar Harian</h1>
    
    <!-- Form input catatan baru -->
    <div class="form-group">
      <textarea id="noteInput" placeholder="Tulis catatan baru di sini..."></textarea>
      <button id="saveBtn">Simpan Catatan</button>
    </div>

    <!-- Area daftar catatan yang tersimpan -->
    <div class="notes-list" id="notesList">
      <!-- Catatan akan dirender secara dinamis via JavaScript -->
    </div>
  </div>

  <!-- Menghubungkan skrip logika aplikasi -->
  <script src="app.js"></script>
</body>
</html>
