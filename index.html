<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Pintar PWA - Hari 3 (Peta Interaktif)</title>
  
  <!-- Manifest & Tema PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <!-- CSS Leaflet untuk Peta Interaktif -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Stylesheet Aplikasi -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🗺️ Catatan Lapangan + Peta GPS</h1>
    
    <div class="form-group">
      <textarea id="noteInput" placeholder="Tulis laporan atau catatan lapangan di sini..."></textarea>
      
      <!-- Tombol & Status Geolokasi -->
      <div class="location-box">
        <button type="button" id="geoBtn" class="geo-btn">Ambil Posisi GPS</button>
        <span id="geoStatus" class="geo-status">Belum ada lokasi dipilih</span>
      </div>

      <!-- Wadah Peta Leaflet -->
      <div id="map" class="map-container"></div>

      <button id="saveBtn" type="button" style="margin-top: 15px;">Simpan Laporan & Lokasi</button>
    </div>

    <!-- Area daftar catatan -->
    <div class="notes-list" id="notesList"></div>
  </div>

  <!-- JavaScript Leaflet untuk Peta Interaktif -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Script Utama Aplikasi -->
  <script src="app.js"></script>
</body>
</html>
