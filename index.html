<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan & Kontak PWA - Hari 4</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>📇 Buku Kontak & Peta Lapangan</h1>
    
    <!-- Tombol Install A2HS (Hidden secara default, muncul jika browser mendukung) -->
    <button id="installBtn" class="install-btn" style="display: none;">📲 Install Aplikasi ke Perangkat</button>

    <div class="form-group">
      <!-- Input Data Terstruktur untuk IndexedDB -->
      <input type="text" id="nameInput" placeholder="Nama Petugas / Kontak..." class="input-field">
      <input type="tel" id="phoneInput" placeholder="Nomor Telepon / WhatsApp..." class="input-field">
      <textarea id="noteInput" placeholder="Catatan atau laporan tugas lapangan..."></textarea>
      
      <div class="location-box">
        <button type="button" id="geoBtn" class="geo-btn">Ambil Posisi GPS</button>
        <span id="geoStatus" class="geo-status">Belum ada lokasi dipilih</span>
      </div>

      <div id="map" class="map-container"></div>

      <button id="saveBtn" type="button" style="margin-top: 15px;">Simpan ke IndexedDB</button>
    </div>

    <!-- Area daftar data terstruktur -->
    <div class="notes-list" id="notesList"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
