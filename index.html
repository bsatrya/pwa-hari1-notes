<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Lapangan & Info Warga - PWA Hari 5</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🚀 Dashboard Info Warga & Lapangan</h1>
    <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 15px;">Sistem PWA Offline-First dengan GPS & IndexedDB</p>
    
    <!-- Tombol Install A2HS -->
    <button id="installBtn" class="install-btn" style="display: none;">📲 Install Dashboard ke Perangkat</button>

    <div class="form-group">
      <input type="text" id="nameInput" placeholder="Nama Pengirim / Petugas..." class="input-field">
      <input type="tel" id="phoneInput" placeholder="Nomor Telepon / WhatsApp..." class="input-field">
      <textarea id="noteInput" placeholder="Tulis informasi kegiatan warga atau laporan lapangan..."></textarea>
      
      <div class="location-box">
        <button type="button" id="geoBtn" class="geo-btn">Ambil Posisi GPS</button>
        <span id="geoStatus" class="geo-status">Belum ada lokasi dipilih</span>
      </div>

      <div id="map" class="map-container"></div>

      <button id="saveBtn" type="button" style="margin-top: 15px; background-color: #1e3a8a;">Publikasikan Informasi</button>
    </div>

    <!-- Area daftar data -->
    <div class="notes-list" id="notesList"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="app.js"></script>
</body>
</html>
